name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q src api tests
      - run: python -m unittest discover -s tests -v
      - name: Validate notebook JSON
        run: python -c "import json,pathlib; files=list(pathlib.Path('notebooks').rglob('*.ipynb')); [json.loads(p.read_text(encoding='utf-8')) for p in files]; print(f'Validated {len(files)} notebooks')"
